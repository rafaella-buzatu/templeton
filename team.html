<!DOCTYPE html>
<html lang="en">

<body>
    <header>

            <div class="logo-container">
                <img src="images/leidenlogo.svg" alt="Leiden University Logo">
                <div class="logo">Drukker Research Group</div>
            </div>
    
            <!-- Regular Navigation for Desktop -->
            <nav class="desktop-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="team.html">Research Group</a></li>
                    <li class="dropdown">
                        <button class="dropbtn">Projects 
                            <i class="fa fa-caret-down"></i>

                    </li>

            </nav>
    
            <!-- Call-to-Action Button -->
            <div class="cta-button">
                <a href="contact.html">Contact Us</a>

            <!-- Mobile Menu Toggle (Hamburger Icon) -->
            <div class="mobile-menu-icon" onclick="toggleMobileMenu()">

        <!-- Mobile Navigation (Hidden by Default) -->
        <nav class="mobile-nav">
            <ul>

</body>
    <script>
        function toggleMobileMenu() {
            var menu = document.querySelector('.mobile-nav');
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'block';
            }
        }
        
        // Function to toggle the "Projects" dropdown inside the mobile menu
        function toggleProjectsMenu() {
            var dropdown = document.getElementById('projectsDropdown');
            if (dropdown.style.display === 'block') {
                dropdown.style.display = 'none';
            } else {
                dropdown.style.display = 'block';
            }
        }
    </script>

</html>
